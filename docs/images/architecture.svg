<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b6b45"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d1f"/>
    </marker>
  </defs>

  <!-- background (keeps it readable in GitHub dark mode) -->
  <rect width="960" height="470" rx="16" fill="#f7f9f4"/>

  <!-- ================= PHONE ================= -->
  <rect x="24" y="24" width="360" height="422" rx="14" fill="#ffffff" stroke="#4b6b45" stroke-width="2"/>
  <text x="44" y="56" font-size="18" font-weight="700" fill="#1f2a1c">📱 Phone · Flutter app</text>
  <text x="44" y="78" font-size="12.5" fill="#5b6657">Works fully offline</text>

  <!-- inputs -->
  <rect x="44" y="94" width="96" height="58" rx="8" fill="#e8f0e3"/>
  <text x="92" y="118" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2a1c">Text</text>
  <text x="92" y="136" font-size="11" text-anchor="middle" fill="#5b6657">"24 tea"</text>

  <rect x="150" y="94" width="96" height="58" rx="8" fill="#e8f0e3"/>
  <text x="198" y="118" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2a1c">Screenshot</text>
  <text x="198" y="136" font-size="11" text-anchor="middle" fill="#5b6657">receipt / UPI</text>

  <rect x="256" y="94" width="108" height="58" rx="8" fill="#e8f0e3"/>
  <text x="310" y="118" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2a1c">Notification</text>
  <text x="310" y="136" font-size="11" text-anchor="middle" fill="#5b6657">bank SMS / UPI</text>

  <line x1="92" y1="152" x2="190" y2="186" stroke="#4b6b45" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="198" y1="152" x2="200" y2="186" stroke="#4b6b45" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="310" y1="152" x2="214" y2="186" stroke="#4b6b45" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- sqlite -->
  <rect x="64" y="190" width="280" height="76" rx="10" fill="#4b6b45"/>
  <text x="204" y="218" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">SQLite (on device)</text>
  <text x="204" y="238" font-size="12" text-anchor="middle" fill="#dfe9da">raw text · status: pending → synced</text>
  <text x="204" y="255" font-size="12" text-anchor="middle" fill="#dfe9da">+ parsed amount · category · date</text>

  <line x1="204" y1="266" x2="204" y2="300" stroke="#4b6b45" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- summary -->
  <rect x="64" y="304" width="280" height="122" rx="10" fill="#e8f0e3" stroke="#b9cdb0"/>
  <text x="204" y="330" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a1c">Summary tab</text>
  <text x="204" y="354" font-size="12" text-anchor="middle" fill="#3d4a39">Daily &amp; weekly totals</text>
  <text x="204" y="374" font-size="12" text-anchor="middle" fill="#3d4a39">Daily limit with weekly rollover</text>
  <text x="204" y="394" font-size="12" text-anchor="middle" fill="#3d4a39">Category breakdown</text>
  <text x="204" y="414" font-size="11" text-anchor="middle" fill="#6c7768">computed on the phone · no AI needed</text>

  <!-- ================= LINK ================= -->
  <line x1="384" y1="210" x2="566" y2="210" stroke="#4b6b45" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="475" y="186" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2a1c">POST /api/sync</text>
  <text x="475" y="201" font-size="11" text-anchor="middle" fill="#5b6657">raw text + created_at</text>

  <line x1="566" y1="252" x2="384" y2="252" stroke="#8a6d1f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-back)"/>
  <text x="475" y="274" font-size="11" text-anchor="middle" fill="#8a6d1f">amount · category · date</text>

  <rect x="404" y="300" width="142" height="56" rx="8" fill="#fff8e6" stroke="#e3cf98"/>
  <text x="475" y="322" font-size="12" font-weight="600" text-anchor="middle" fill="#5c4810">USB first</text>
  <text x="475" y="340" font-size="11" text-anchor="middle" fill="#7a6420">then Wi-Fi fallback</text>

  <!-- ================= LAPTOP ================= -->
  <rect x="566" y="24" width="370" height="422" rx="14" fill="#ffffff" stroke="#4b6b45" stroke-width="2"/>
  <text x="586" y="56" font-size="18" font-weight="700" fill="#1f2a1c">💻 Laptop · started on demand</text>
  <text x="586" y="78" font-size="12.5" fill="#5b6657">./start_ai.sh  ·  ./stop_ai.sh</text>

  <rect x="606" y="182" width="290" height="96" rx="10" fill="#4b6b45"/>
  <text x="751" y="212" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Flask API  :5000</text>
  <text x="751" y="234" font-size="12" text-anchor="middle" fill="#dfe9da">validates the AI output</text>
  <text x="751" y="253" font-size="12" text-anchor="middle" fill="#dfe9da">falls back to the number in the text</text>

  <rect x="606" y="94" width="290" height="62" rx="10" fill="#e8f0e3" stroke="#b9cdb0"/>
  <text x="751" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a1c">Ollama · qwen3:8b</text>
  <text x="751" y="140" font-size="11.5" text-anchor="middle" fill="#3d4a39">text → JSON (amount, category, date)</text>
  <line x1="730" y1="182" x2="730" y2="160" stroke="#4b6b45" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="772" y1="158" x2="772" y2="180" stroke="#4b6b45" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="606" y="320" width="290" height="80" rx="10" fill="#e8f0e3" stroke="#b9cdb0"/>
  <text x="751" y="350" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a1c">PostgreSQL</text>
  <text x="751" y="372" font-size="11.5" text-anchor="middle" fill="#3d4a39">expenses table</text>
  <line x1="751" y1="278" x2="751" y2="316" stroke="#4b6b45" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
